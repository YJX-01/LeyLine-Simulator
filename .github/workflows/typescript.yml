name: TypeScript
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:build
      - run: pnpm data:check
      - run: node tools/scripts/checks/check-docs.mjs
      - run: pnpm architecture:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:content
      - run: pnpm build
      - run: pnpm build:check
      - run: node tests/performance/timeline.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm data:build && pnpm --filter @leyline/web build --base=/leyline/ --outDir=dist-subpath
      - run: pnpm exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            artifacts/
            test-results/
